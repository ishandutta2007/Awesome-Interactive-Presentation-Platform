<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="420" viewBox="0 0 1200 420"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#080b11"/></linearGradient><linearGradient id="titleGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentGlow1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".35"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><linearGradient id="accentGlow2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".28"/><stop offset="100%" stop-color="#a855f7" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="14"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width=".6" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseOrb1{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.15) translate(30px,20px);opacity:.55}}@keyframes pulseOrb2{0%{transform:scale(1) translate(0,0);opacity:.3}50%{transform:scale(1.2) translate(-25px,-15px);opacity:.5}}@keyframes floatPill{0%{transform:translateY(0)}50%{transform:translateY(-7px)}}.orb-1{animation:pulseOrb1 9s ease-in-out infinite;transform-origin:200px 100px}.orb-2{animation:pulseOrb2 11s ease-in-out infinite;transform-origin:1000px 320px}.pill-animated{animation:floatPill 4s ease-in-out infinite}.pill-text,.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-1px}.sub-text{font-weight:400}.pill-text{font-weight:600;font-size:13px}</style><rect width="1200" height="420" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="420" fill="url(#grid)" rx="16"/><g><circle cx="220" cy="110" r="180" fill="url(#accentGlow1)" class="orb-1" filter="url(#glow)"/><circle cx="980" cy="310" r="210" fill="url(#accentGlow2)" class="orb-2" filter="url(#glow)"/></g><g opacity=".22" transform="translate(870, 55)"><rect width="240" height="150" x="0" y="20" fill="none" stroke="#38bdf8" stroke-width="2" rx="8"/><rect width="240" height="150" x="25" y="0" fill="none" stroke="#818cf8" stroke-width="2" rx="8"/><rect width="240" height="150" x="50" y="-20" fill="#1e293b" stroke="#c084fc" stroke-width="2" rx="8"/><rect width="18" height="40" x="80" y="60" fill="#38bdf8" rx="3"/><rect width="18" height="60" x="110" y="40" fill="#818cf8" rx="3"/><rect width="18" height="80" x="140" y="20" fill="#c084fc" rx="3"/><rect width="18" height="50" x="170" y="50" fill="#f43f5e" rx="3"/></g><g><g transform="translate(80, 0) translate(0, 68)"><rect width="250" height="32" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" rx="16"/><circle cx="18" cy="16" r="5" fill="#38bdf8"><animate attributeName="opacity" dur="2s" repeatCount="indefinite" values="1;0.3;1"/></circle><text x="32" y="21" fill="#93c5fd" class="pill-text" font-size="12" letter-spacing=".5">CURATED TECH ECOSYSTEM</text></g><text x="0" y="160" fill="url(#titleGradient)" class="title-text" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.6))" font-size="46" transform="translate(80, 0)">Awesome Interactive Presentation Platform</text><text x="0" y="206" fill="#cbd5e1" class="sub-text" font-size="20" transform="translate(80, 0)">Next-Gen Live Audience Polling, Real-Time Slide Decks, Gamified Quizzes &amp; Web Frameworks</text><text x="0" y="236" fill="#94a3b8" class="sub-text" font-size="15" transform="translate(80, 0)">A meticulously curated directory of production-grade SaaS solutions &amp; high-performance open-source engines</text><g class="pill-animated"><g transform="translate(80, 0) translate(0, 278) translate(0, 0)"><rect width="170" height="38" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity=".95" rx="19"/><text x="20" y="24" fill="#38bdf8" class="pill-text">📊 Live Polling &amp; Q&amp;A</text></g><g transform="translate(80, 0) translate(0, 278) translate(182, 0)"><rect width="170" height="38" fill="#0f172a" stroke="#818cf8" stroke-width="1" opacity=".95" rx="19"/><text x="20" y="24" fill="#a5b4fc" class="pill-text">📝 Markdown-to-Slide</text></g><g transform="translate(80, 0) translate(0, 278) translate(364, 0)"><rect width="178" height="38" fill="#0f172a" stroke="#c084fc" stroke-width="1" opacity=".95" rx="19"/><text x="18" y="24" fill="#e9d5ff" class="pill-text">🎨 Infinite Canvas Deck</text></g><g transform="translate(80, 0) translate(0, 278) translate(554, 0)"><rect width="164" height="38" fill="#0f172a" stroke="#f43f5e" stroke-width="1" opacity=".95" rx="19"/><text x="18" y="24" fill="#fecdd3" class="pill-text">🎮 Gamified Quizzes</text></g><g transform="translate(80, 0) translate(0, 278) translate(730, 0)"><rect width="160" height="38" fill="#0f172a" stroke="#10b981" stroke-width="1" opacity=".95" rx="19"/><text x="18" y="24" fill="#a7f3d0" class="pill-text">💻 Terminal &amp; CLI</text></g></g><g transform="translate(80, 0) translate(0, 350)"><line x1="0" x2="1040" y1="0" y2="0" stroke="#334155" stroke-width=".8" opacity=".4"/><text x="0" y="24" fill="#64748b" class="sub-text" font-size="12">⚡ Real-time WebSocket Synchronizations • 🌐 HTML5 / WebRTC / CSS3 Transforms • 🔒 Self-Hostable &amp; Cloud Ready</text></g></g></svg>